<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>智慧生活管家 — 題組對話測試</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e4e7ec; --me:#0b7; --bot:#eef1f5; --ink:#1f2430; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; height:100dvh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 8px 0 0; }
  select, button { font-size:14px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button.primary { background:var(--me); color:#fff; border-color:var(--me); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:9px 12px; border-radius:14px; white-space:pre-wrap; line-height:1.5; font-size:14px; }
  .bot { background:var(--bot); align-self:flex-start; border-bottom-left-radius:4px; }
  .me  { background:var(--me); color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
  .sys { align-self:center; color:#8a90a0; font-size:12px; }
  form { display:flex; gap:8px; padding:12px 16px; background:var(--card); border-top:1px solid var(--line); }
  #text { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; }
  pre { background:#0f1420; color:#c8e1ff; padding:12px; border-radius:10px; overflow:auto; font-size:12px; margin:0 16px 12px; }
  details { margin:0 16px 12px; } summary { cursor:pointer; color:#667; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏠 智慧生活管家 · 題組對話測試</h1>
    <select id="form"></select>
    <button class="primary" id="start">開始</button>
    <span class="sys" id="hint">選一個服務開始對話</span>
  </header>
  <div id="log"></div>
  <details id="fcWrap" hidden><summary>諮詢單 feedback_content（送出結果）</summary><pre id="fc"></pre></details>
  <form id="composer">
    <input id="text" placeholder="用自然語言描述，例如「冷氣兩台要洗，分離式」…" autocomplete="off" disabled />
    <button class="primary" id="send" disabled>送出</button>
  </form>
</div>
<script>
const $ = s => document.querySelector(s);
let sid = null;

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  $('#log').appendChild(d);
  $('#log').scrollTop = $('#log').scrollHeight;
  return d;
}
async function post(url, body) {
  const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}
function setBusy(b) { $('#text').disabled = b || !sid; $('#send').disabled = b || !sid; }

async function loadForms() {
  const forms = await (await fetch('/api/forms')).json();
  $('#form').innerHTML = forms.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
}
$('#start').onclick = async () => {
  $('#log').innerHTML = ''; $('#fcWrap').hidden = true; sid = null;
  add('sys', '連線中…');
  try {
    const res = await post('/api/chat/start', {form_id: $('#form').value});
    sid = res.session_id;
    $('#log').lastChild.remove();
    add('bot', res.reply);
    $('#hint').textContent = '對話中';
    setBusy(false); $('#text').focus();
  } catch (e) { $('#log').lastChild.textContent = '啟動失敗：' + e.message; }
};
$('#composer').onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $('#text').value.trim();
  if (!text || !sid) return;
  add('me', text); $('#text').value = '';
  setBusy(true);
  const thinking = add('sys', '管家思考中…');
  try {
    const res = await post('/api/chat/message', {session_id: sid, message: text});
    thinking.remove();
    add('bot', res.reply);
    if (res.feedback_content) {
      $('#fc').textContent = JSON.stringify(res.feedback_content, null, 2);
      $('#fcWrap').hidden = false;
    }
    if (res.done) { $('#hint').textContent = '已完成 ✓'; setBusy(true); }
    else { setBusy(false); $('#text').focus(); }
  } catch (e) { thinking.textContent = '錯誤：' + e.message; setBusy(false); }
};
loadForms();
</script>
</body>
</html>
