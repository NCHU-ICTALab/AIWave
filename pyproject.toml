[project]
name = "smart-living-butler"
version = "0.1.0"
description = "智慧生活管家 — 2026 雲湧智生黑客松（統一資訊命題）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faker>=37.4.0",
    "fastapi>=0.139.2",
    "mcp>=1.28.1",
    "openai>=2.48.0",
    "pydantic>=2",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "openapi-spec-validator>=0.7.2",
    "pyyaml>=6.0.2",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
]

# 不打包成 wheel，當作應用專案；模組以 pythonpath 匯入
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
