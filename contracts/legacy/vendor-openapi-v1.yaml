openapi: 3.0.3
info:
  title: AIWave Vendor API
  version: 1.0.0
  description: >-
    智慧管家與合作廠商之間的穩定契約。fake 與 real adapter 都依賴此規格；
    所有金額皆為新台幣整數，所有寫入皆以 Idempotency-Key 防止重複執行。
servers:
  - url: http://127.0.0.1:8020
    description: 本機獨立 fake vendor server
tags:
  - name: Vendors
  - name: Inquiries
  - name: Orders
  - name: Fake control
paths:
  /v1/vendors:
    get:
      tags: [Vendors]
      operationId: searchVendors
      parameters:
        - {$ref: '#/components/parameters/ServiceId'}
        - {$ref: '#/components/parameters/CountyCode'}
        - {$ref: '#/components/parameters/DistrictCode'}
        - name: supportsUrgent
          in: query
          schema: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/VendorList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/vendors/{vendorId}:
    get:
      tags: [Vendors]
      operationId: getVendor
      parameters: [{$ref: '#/components/parameters/VendorId'}]
      responses:
        '200': {$ref: '#/components/responses/VendorSingle'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/vendors/{vendorId}/locations:
    get:
      tags: [Vendors]
      operationId: listVendorLocations
      parameters: [{$ref: '#/components/parameters/VendorId'}]
      responses:
        '200': {$ref: '#/components/responses/LocationList'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/offerings:
    get:
      tags: [Vendors]
      operationId: listOfferings
      parameters:
        - name: vendorId
          in: query
          schema: {type: string}
        - {$ref: '#/components/parameters/ServiceId'}
      responses:
        '200': {$ref: '#/components/responses/OfferingList'}
        default: {$ref: '#/components/responses/Error'}
  /v1/availability:
    get:
      tags: [Vendors]
      operationId: getAvailability
      parameters:
        - name: vendorId
          in: query
          required: true
          schema: {type: string}
        - name: serviceId
          in: query
          required: true
          schema: {type: string}
        - name: date
          in: query
          schema: {type: string, format: date}
      responses:
        '200': {$ref: '#/components/responses/AvailabilityList'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/inquiries:
    get:
      tags: [Inquiries]
      operationId: listInquiries
      parameters:
        - {name: vendorId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: accountId, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/InquiryList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Inquiries]
      operationId: createInquiry
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InquiryCreate'}
      responses:
        '201': {$ref: '#/components/responses/InquirySingle'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/inquiries/{inquiryId}:
    get:
      tags: [Inquiries]
      operationId: getInquiry
      parameters: [{$ref: '#/components/parameters/InquiryId'}]
      responses:
        '200': {$ref: '#/components/responses/InquirySingle'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/inquiries/{inquiryId}/quotes:
    get:
      tags: [Inquiries]
      operationId: listQuotes
      parameters: [{$ref: '#/components/parameters/InquiryId'}]
      responses:
        '200': {$ref: '#/components/responses/QuoteList'}
        '404': {$ref: '#/components/responses/Error'}
    post:
      tags: [Inquiries]
      operationId: createQuote
      parameters:
        - {$ref: '#/components/parameters/InquiryId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuoteCreate'}
      responses:
        '201': {$ref: '#/components/responses/QuoteSingle'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      parameters:
        - {name: vendorId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: accountId, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/OrderList'}
        default: {$ref: '#/components/responses/Error'}
    post:
      tags: [Orders]
      operationId: createOrder
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
      responses:
        '201': {$ref: '#/components/responses/OrderSingle'}
        '400': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /v1/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      parameters: [{$ref: '#/components/parameters/OrderId'}]
      responses:
        '200': {$ref: '#/components/responses/OrderSingle'}
        '404': {$ref: '#/components/responses/Error'}
  /v1/orders/{orderId}/events:
    post:
      tags: [Orders]
      operationId: appendOrderEvent
      parameters:
        - {$ref: '#/components/parameters/OrderId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderEventCreate'}
      responses:
        '201': {$ref: '#/components/responses/OrderSingle'}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /__fake__/state:
    get:
      tags: [Fake control]
      operationId: getFakeState
      security: [{FakeControlKey: []}]
      responses:
        '200': {$ref: '#/components/responses/GenericObject'}
        '401': {$ref: '#/components/responses/Error'}
  /__fake__/faults/next:
    put:
      tags: [Fake control]
      operationId: injectNextFault
      security: [{FakeControlKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FaultCreate'}
      responses:
        '200': {$ref: '#/components/responses/GenericObject'}
        '401': {$ref: '#/components/responses/Error'}
  /__fake__/reset:
    post:
      tags: [Fake control]
      operationId: resetFakeState
      security: [{FakeControlKey: []}]
      responses:
        '200': {$ref: '#/components/responses/GenericObject'}
        '401': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    FakeControlKey:
      type: apiKey
      in: header
      name: X-Fake-Control-Key
  parameters:
    VendorId:
      name: vendorId
      in: path
      required: true
      schema: {type: string}
    InquiryId:
      name: inquiryId
      in: path
      required: true
      schema: {type: string}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string}
    ServiceId:
      name: serviceId
      in: query
      schema: {type: string}
    CountyCode:
      name: countyCode
      in: query
      schema: {type: string}
    DistrictCode:
      name: districtCode
      in: query
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1}
  schemas:
    Source:
      type: object
      required: [kind, label, url, checkedAt, dataPolicy]
      properties:
        kind: {type: string}
        label: {type: string}
        url: {type: string, format: uri}
        checkedAt: {type: string, format: date}
        observedInOpenpoint: {type: boolean}
        dataPolicy: {type: string}
    Vendor:
      type: object
      required: [id, name, legalName, summary, serviceIds, supportsUrgent, rating, reviewCount, source]
      properties:
        id: {type: string}
        name: {type: string}
        legalName: {type: string}
        summary: {type: string}
        serviceIds: {type: array, items: {type: string}}
        supportsUrgent: {type: boolean}
        rating: {type: number, minimum: 0, maximum: 5}
        reviewCount: {type: integer, minimum: 0}
        source: {$ref: '#/components/schemas/Source'}
    Location:
      type: object
      required: [id, vendorId, name, countyCode, countyName, districtCode, districtName, postalCode, address, phone]
      properties:
        id: {type: string}
        vendorId: {type: string}
        name: {type: string}
        countyCode: {type: string}
        countyName: {type: string}
        districtCode: {type: string}
        districtName: {type: string}
        postalCode: {type: string}
        address: {type: string}
        phone: {type: string}
        contactName: {type: string}
        serviceRadiusKm: {type: integer, minimum: 0}
        dataSource: {type: string}
    Offering:
      type: object
      required: [id, vendorId, serviceId, name, basePrice, currency, pricingUnit, slots, supportsUrgent]
      properties:
        id: {type: string}
        vendorId: {type: string}
        serviceId: {type: string}
        name: {type: string}
        description: {type: string}
        basePrice: {type: integer, minimum: 0}
        currency: {type: string, enum: [TWD]}
        pricingUnit: {type: string}
        slots: {type: array, items: {type: string}}
        supportsUrgent: {type: boolean}
        dataSource: {type: string}
    Availability:
      type: object
      required: [date, slot, available, remainingCapacity]
      properties:
        date: {type: string, format: date}
        slot: {type: string}
        available: {type: boolean}
        remainingCapacity: {type: integer, minimum: 0}
    Consumer:
      type: object
      required: [name, phone]
      properties:
        name: {type: string}
        phone: {type: string}
        email: {type: string, format: email}
    InquiryCreate:
      type: object
      required: [accountId, serviceId, consumer, location, summary]
      properties:
        accountId: {type: string}
        serviceId: {type: string}
        vendorId: {type: string, nullable: true}
        consumer: {$ref: '#/components/schemas/Consumer'}
        location: {type: object, additionalProperties: true}
        preferredSlots: {type: array, items: {type: string}}
        budget: {type: integer, minimum: 0, nullable: true}
        urgency: {type: string, enum: [normal, urgent]}
        answers: {type: object, additionalProperties: true}
        summary: {type: string}
        externalReference: {type: string, nullable: true}
    Inquiry:
      allOf:
        - {$ref: '#/components/schemas/InquiryCreate'}
        - type: object
          required: [id, status, version, createdAt, updatedAt, dataSource]
          properties:
            id: {type: string}
            status: {type: string}
            version: {type: integer, minimum: 1}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
            dataSource: {type: string}
    QuoteItem:
      type: object
      required: [name, quantity, unitPrice]
      properties:
        name: {type: string}
        quantity: {type: integer, minimum: 1}
        unitPrice: {type: integer, minimum: 0}
    QuoteCreate:
      type: object
      required: [vendorId, items, validUntil]
      properties:
        vendorId: {type: string}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/QuoteItem'}}
        validUntil: {type: string, format: date}
    Quote:
      allOf:
        - {$ref: '#/components/schemas/QuoteCreate'}
        - type: object
          required: [id, inquiryId, subtotal, total, currency, status, createdAt]
          properties:
            id: {type: string}
            inquiryId: {type: string}
            subtotal: {type: integer, minimum: 0}
            total: {type: integer, minimum: 0}
            currency: {type: string, enum: [TWD]}
            status: {type: string}
            createdAt: {type: string, format: date-time}
    OrderCreate:
      type: object
      required: [inquiryId, quoteId, accountId]
      properties:
        inquiryId: {type: string}
        quoteId: {type: string}
        accountId: {type: string}
        externalReference: {type: string, nullable: true}
    OrderEventCreate:
      type: object
      required: [type, status]
      properties:
        type: {type: string}
        status: {type: string}
        note: {type: string, nullable: true}
        occurredAt: {type: string, format: date-time, nullable: true}
    Order:
      allOf:
        - {$ref: '#/components/schemas/OrderCreate'}
        - type: object
          required: [id, vendorId, status, version, events, createdAt, updatedAt]
          properties:
            id: {type: string}
            vendorId: {type: string}
            status: {type: string}
            version: {type: integer, minimum: 1}
            events: {type: array, items: {type: object, additionalProperties: true}}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    FaultCreate:
      type: object
      required: [path]
      properties:
        method: {type: string, default: GET}
        path: {type: string}
        status: {type: integer, minimum: 200, maximum: 599, default: 503}
        detail: {type: string}
        delay_ms: {type: integer, minimum: 0, maximum: 10000}
        body: {nullable: true}
    Meta:
      type: object
      required: [scenario, dataSource, asOf, traceId]
      properties:
        scenario: {type: string}
        dataSource: {type: string}
        asOf: {type: string, format: date-time}
        traceId: {type: string}
        idempotentReplay: {type: boolean}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code: {type: string}
            message: {type: string}
            details: {nullable: true}
            traceId: {type: string}
  responses:
    VendorList:
      description: 廠商清單
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Vendor'}}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    VendorSingle:
      description: 單一廠商
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Vendor'}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    LocationList:
      description: 服務據點清單
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Location'}}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    OfferingList:
      description: 服務方案清單
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Offering'}}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    AvailabilityList:
      description: 可預約時段
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Availability'}}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    InquirySingle:
      description: 單一諮詢單
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Inquiry'}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    InquiryList:
      description: 諮詢單清單
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Inquiry'}}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    QuoteList:
      description: 報價清單
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Quote'}}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    QuoteSingle:
      description: 單一報價
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Quote'}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    OrderSingle:
      description: 單一履約訂單
      content: {application/json: {schema: {type: object, properties: {data: {$ref: '#/components/schemas/Order'}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    OrderList:
      description: 履約訂單清單
      content: {application/json: {schema: {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/Order'}}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    GenericObject:
      description: fake control 回應
      content: {application/json: {schema: {type: object, properties: {data: {type: object, additionalProperties: true}, meta: {$ref: '#/components/schemas/Meta'}}}}}
    Error:
      description: 一致錯誤封套
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
