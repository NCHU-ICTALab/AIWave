openapi: 3.0.3
info:
  title: AIWave Partner API
  version: 2.0.0
  description: >-
    AIWave 與核准合作服務提供者共用的唯一現行契約。所有資料都由 Bearer API key
    綁定 Provider 與 scopes；所有寫入都要求 Idempotency-Key。
servers:
  - url: http://127.0.0.1:8020
    description: 獨立 Partner fake upstream
security:
  - PartnerBearer: []
tags:
  - name: Catalog
  - name: Availability
  - name: Bookings
  - name: Synchronization
paths:
  /partner/v1/catalog:
    get:
      tags: [Catalog]
      operationId: getPartnerCatalog
      x-aiwave-scopes: [catalog:read]
      responses:
        '200': {$ref: '#/components/responses/CatalogResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      tags: [Catalog]
      operationId: replacePartnerCatalog
      x-aiwave-scopes: [catalog:write]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Catalog'}
      responses:
        '200': {$ref: '#/components/responses/CatalogResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /partner/v1/availability:
    get:
      tags: [Availability]
      operationId: getPartnerAvailability
      x-aiwave-scopes: [availability:read]
      parameters:
        - {name: offeringId, in: query, schema: {type: string}}
        - {name: startsAfter, in: query, schema: {type: string, format: date-time}}
        - {name: startsBefore, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {$ref: '#/components/responses/AvailabilityResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    put:
      tags: [Availability]
      operationId: replacePartnerAvailability
      x-aiwave-scopes: [availability:write]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seedVersion, slots]
              properties:
                seedVersion: {type: string}
                slots:
                  type: array
                  items: {$ref: '#/components/schemas/AvailabilitySlot'}
      responses:
        '200': {$ref: '#/components/responses/AvailabilityResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /partner/v1/bookings:
    get:
      tags: [Bookings]
      operationId: listPartnerBookings
      x-aiwave-scopes: [bookings:read]
      parameters:
        - {name: status, in: query, schema: {type: string}}
        - {name: updatedAfter, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {$ref: '#/components/responses/BookingListResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Bookings]
      operationId: pushBookingToPartner
      x-aiwave-scopes: [bookings:write]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingCreate'}
      responses:
        '201': {$ref: '#/components/responses/BookingResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /partner/v1/bookings/{bookingId}:
    get:
      tags: [Bookings]
      operationId: getPartnerBooking
      x-aiwave-scopes: [bookings:read]
      parameters: [{$ref: '#/components/parameters/BookingId'}]
      responses:
        '200': {$ref: '#/components/responses/BookingResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Bookings]
      operationId: updatePartnerBooking
      x-aiwave-scopes: [bookings:write]
      parameters:
        - {$ref: '#/components/parameters/BookingId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingUpdate'}
      responses:
        '200': {$ref: '#/components/responses/BookingResponse'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /partner/v1/snapshot:
    get:
      tags: [Synchronization]
      operationId: getPartnerSnapshot
      x-aiwave-scopes: [snapshot:read]
      responses:
        '200':
          description: Provider 資料與同步版本摘要
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/Envelope'}
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Snapshot'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /partner/v1/webhook-subscriptions:
    put:
      tags: [Synchronization]
      operationId: configurePartnerWebhook
      x-aiwave-scopes: [webhooks:write]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookSubscription'}
      responses:
        '200':
          description: 已保存簽章 webhook 設定
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    PartnerBearer:
      type: http
      scheme: bearer
      bearerFormat: AIWavePartnerKey
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 200}
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: {type: string}
  schemas:
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta:
          type: object
          required: [traceId, seedVersion, idempotentReplay]
          properties:
            traceId: {type: string}
            seedVersion: {type: string}
            idempotentReplay: {type: boolean}
            asOf: {type: string, format: date-time}
    Provider:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    Location:
      type: object
      required: [id, providerId, name, address]
      properties:
        id: {type: string}
        providerId: {type: string}
        name: {type: string}
        address: {type: string}
    Offering:
      type: object
      required: [id, providerId, name, serviceId, basePrice, currency]
      properties:
        id: {type: string}
        providerId: {type: string}
        locationIds: {type: array, items: {type: string}}
        name: {type: string}
        serviceId: {type: string}
        basePrice: {type: integer, minimum: 0}
        currency: {type: string, enum: [TWD]}
    Resource:
      type: object
      required: [id, providerId, name, kind]
      properties:
        id: {type: string}
        providerId: {type: string}
        name: {type: string}
        kind: {type: string}
    Catalog:
      type: object
      required: [seedVersion, provider, locations, offerings, resources]
      properties:
        seedVersion: {type: string}
        provider: {$ref: '#/components/schemas/Provider'}
        locations: {type: array, items: {$ref: '#/components/schemas/Location'}}
        offerings: {type: array, items: {$ref: '#/components/schemas/Offering'}}
        resources: {type: array, items: {$ref: '#/components/schemas/Resource'}}
    AvailabilitySlot:
      type: object
      required: [id, providerId, offeringId, locationId, startsAt, endsAt, status, capacity]
      properties:
        id: {type: string}
        providerId: {type: string}
        offeringId: {type: string}
        locationId: {type: string}
        resourceId: {type: string, nullable: true}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [available, held, booked, unavailable]}
        capacity: {type: integer, minimum: 0}
    BookingCreate:
      type: object
      required: [externalReference, accountReference, offeringId, locationId, slotId, startsAt, endsAt]
      properties:
        externalReference: {type: string}
        accountReference: {type: string}
        offeringId: {type: string}
        locationId: {type: string}
        resourceId: {type: string, nullable: true}
        slotId: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        notes: {type: string, nullable: true}
    Booking:
      allOf:
        - {$ref: '#/components/schemas/BookingCreate'}
        - type: object
          required: [id, providerId, status, version, createdAt, updatedAt]
          properties:
            id: {type: string}
            providerId: {type: string}
            status: {type: string, enum: [pending_provider, confirmed, rejected, in_service, completed, cancelled, exception]}
            version: {type: integer, minimum: 1}
            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
    BookingUpdate:
      type: object
      required: [expectedVersion, status]
      properties:
        expectedVersion: {type: integer, minimum: 1}
        status: {type: string, enum: [confirmed, rejected, in_service, completed, cancelled, exception]}
        note: {type: string, nullable: true}
    Snapshot:
      type: object
      required: [providerId, seedVersion, catalogVersion, availabilityVersion, bookingVersion, counts]
      properties:
        providerId: {type: string}
        seedVersion: {type: string}
        catalogVersion: {type: integer}
        availabilityVersion: {type: integer}
        bookingVersion: {type: integer}
        counts:
          type: object
          additionalProperties: {type: integer}
    WebhookSubscription:
      type: object
      required: [url, events, signingSecret]
      properties:
        url: {type: string, format: uri}
        events: {type: array, items: {type: string}}
        signingSecret: {type: string, minLength: 16}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code: {type: string}
            message: {type: string}
            traceId: {type: string}
            details: {}
  responses:
    CatalogResponse:
      description: Provider catalog
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties: {data: {$ref: '#/components/schemas/Catalog'}}
    AvailabilityResponse:
      description: Provider availability
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/AvailabilitySlot'}}
    BookingResponse:
      description: Provider booking
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties: {data: {$ref: '#/components/schemas/Booking'}}
    BookingListResponse:
      description: Provider bookings
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Envelope'}
              - type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Booking'}}
    Error:
      description: Traceable error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
