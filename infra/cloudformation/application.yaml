AWSTemplateFormatVersion: '2010-09-09'
Description: AIWave ECS Fargate production foundation with CloudFront, ALB, SQS, and optional Aurora Serverless v2.

Parameters:
  ProjectName:
    Type: String
    Default: aiwave
    AllowedPattern: '[a-z0-9-]+'
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: '[a-z0-9-]+'
  ImageUri:
    Type: String
    Description: Immutable ECR image URI including tag.
  FrontendBucketName:
    Type: String
  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-3b927c52
    AllowedPattern: 'pl-[0-9a-f]+'
    Description: AWS-managed com.amazonaws.global.cloudfront.origin-facing prefix list in us-east-1.
  OriginVerifyHeaderValue:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Rotated value required by the ALB listener for CloudFront origin requests.
  ApiDesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
  DeployDatabase:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  ConfirmDatabaseCosts:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Must be true whenever DeployDatabase is true.
  AuroraMinCapacity:
    Type: Number
    Default: 2
    MinValue: 0.5
    MaxValue: 128
  AuroraMaxCapacity:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 128

Rules:
  DatabaseCostAcknowledged:
    RuleCondition: !Equals [!Ref DeployDatabase, 'true']
    Assertions:
      - Assert: !Equals [!Ref ConfirmDatabaseCosts, 'true']
        AssertDescription: ConfirmDatabaseCosts must be true when enabling the 2-8 ACU Aurora cluster.

Conditions:
  CreateDatabase: !Equals [!Ref DeployDatabase, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-vpc'
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.20.0.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-a'
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-public-b'
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.20.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-app-a'
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.20.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-app-b'
  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.20.20.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-db-a'
  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.20.21.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-db-b'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-nat'
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  AppDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  AppSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref AppRouteTable
  AppSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref AppRouteTable
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DbSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetA
      RouteTableId: !Ref DbRouteTable
  DbSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnetB
      RouteTableId: !Ref DbRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP origin access restricted to the AWS CloudFront origin-facing network.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-alb-sg'
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow FastAPI traffic only from the ALB.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-api-sg'
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateDatabase
    Properties:
      GroupDescription: Allow PostgreSQL only from ECS application tasks.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${EnvironmentName}-db-sg'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 8000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '403'
            ContentType: text/plain
            MessageBody: Forbidden
  OriginHeaderListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Ref OriginVerifyHeaderValue]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${EnvironmentName}'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/${EnvironmentName}/api'
      RetentionInDays: 14
  PartnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/${EnvironmentName}/partner-fake'
      RetentionInDays: 7
  VendorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}/${EnvironmentName}/vendor-fake'
      RetentionInDays: 7

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt AiQueue.Arn

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${EnvironmentName}-api'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt EcsExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          DependsOn:
            - ContainerName: partner-fake
              Condition: HEALTHY
            - ContainerName: vendor-fake
              Condition: HEALTHY
          Cpu: 512
          MemoryReservation: 1024
          Command: [sh, -c, 'uv run --no-dev uvicorn api.app:app --host 0.0.0.0 --port ${PORT:-8000}']
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: '8000'
            - Name: DATA_DIR
              Value: /data
            - Name: PARTNER_MODE
              Value: fake
            - Name: PARTNER_FAKE_URL
              Value: http://127.0.0.1:8020
            - Name: PARTNER_API_KEY
              Value: aiwave-partner
            - Name: VENDOR_MODE
              Value: fake
            - Name: VENDOR_FAKE_URL
              Value: http://127.0.0.1:8021
            - Name: VENDOR_FAKE_CONTROL_KEY
              Value: aiwave-demo-control
            - Name: PROVIDER_MODE
              Value: standard
            - Name: LLM_PROVIDER
              Value: bedrock
            - Name: BEDROCK_MODEL_ID
              Value: us.anthropic.claude-sonnet-4-6
            - Name: CATALOG_SYNC_ON_STARTUP
              Value: 'true'
            - Name: DEMO_RESET_ENABLED
              Value: 'true'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
        - Name: partner-fake
          Image: !Ref ImageUri
          Essential: true
          Cpu: 256
          MemoryReservation: 320
          Command: [uv, run, --no-dev, python, -m, fake_upstreams.partner_app]
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8020/healthz", timeout=2)'
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 15
          Environment:
            - Name: VENDOR_FAKE_PORT
              Value: '8020'
            - Name: PARTNER_FAKE_API_KEY
              Value: aiwave-partner
            - Name: VENDOR_FAKE_CONTROL_KEY
              Value: aiwave-demo-control
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PartnerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: partner
        - Name: vendor-fake
          Image: !Ref ImageUri
          Essential: true
          Cpu: 256
          MemoryReservation: 320
          Command: [uv, run, --no-dev, python, -m, fake_upstreams.vendor_app]
          HealthCheck:
            Command:
              - CMD-SHELL
              - >-
                python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8021/healthz", timeout=2)'
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 15
          Environment:
            - Name: VENDOR_FAKE_PORT
              Value: '8021'
            - Name: VENDOR_FAKE_CONTROL_KEY
              Value: aiwave-demo-control
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref VendorLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: vendor
  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      ServiceName: api
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApiSecurityGroup]
          Subnets: [!Ref AppSubnetA, !Ref AppSubnetB]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref ApiTargetGroup
      EnableExecuteCommand: false

  AiDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-ai-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  AiQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${EnvironmentName}-ai'
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiDeadLetterQueue.Arn
        maxReceiveCount: 3

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${EnvironmentName}-s3-oac'
        Description: Sign CloudFront requests to the private Vue bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless Vue routes to index.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (uri.indexOf('.') === -1) {
            request.uri = '/index.html';
          }
          return request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName}-${EnvironmentName}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Origins:
          - Id: frontend-s3
            DomainName: !Sub '${FrontendBucketName}.s3.${AWS::Region}.amazonaws.com'
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api-alb
            DomainName: !GetAtt LoadBalancer.DNSName
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifyHeaderValue
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${FrontendBucketName}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: CreateDatabase
    Properties:
      DBSubnetGroupDescription: Private database subnets for Aurora Serverless v2.
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateDatabase
    Properties:
      Description: !Sub '${ProjectName} ${EnvironmentName} Aurora credentials'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"aiwave_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    Condition: CreateDatabase
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub '${ProjectName}-${EnvironmentName}-aurora'
      Engine: aurora-postgresql
      EngineMode: provisioned
      EngineVersion: '16.11'
      DatabaseName: aiwave
      Port: 5432
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DatabaseSecurityGroup]
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      BackupRetentionPeriod: 3
      DeletionProtection: true
      StorageEncrypted: true
      CopyTagsToSnapshot: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref AuroraMinCapacity
        MaxCapacity: !Ref AuroraMaxCapacity
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  DatabaseWriter:
    Type: AWS::RDS::DBInstance
    Condition: CreateDatabase
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-${EnvironmentName}-aurora-writer-1'
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      PromotionTier: 1

Outputs:
  VpcId:
    Value: !Ref Vpc
  EcsClusterName:
    Value: !Ref EcsCluster
  EcsServiceName:
    Value: !GetAtt ApiService.Name
  CloudFrontDistributionId:
    Value: !Ref Distribution
  CloudFrontUrl:
    Value: !Sub 'https://${Distribution.DomainName}'
  AiQueueUrl:
    Value: !Ref AiQueue
  DatabaseEndpoint:
    Condition: CreateDatabase
    Value: !GetAtt DatabaseCluster.Endpoint.Address
